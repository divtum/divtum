    <style
       id="style7">
      .trace { fill:none; stroke:url(#trace); stroke-width:1.7; stroke-linecap:round; stroke-dasharray:9 15; animation:flow 4s linear infinite; }
      .trace-solid { fill:none; stroke:url(#trace); stroke-width:1.7; stroke-linecap:round; }
      .trace-dim { fill:none; stroke:#3b6b8e; stroke-opacity:.65; stroke-width:1; }
      .node { fill:#0b1930; stroke:#5eead4; stroke-width:1.4; }
      .pulse { fill:#c8fff8; filter:url(#glow); animation:pulse 2.6s ease-in-out infinite; }
      .label { fill:#91a8c4; font:600 10px Arial, sans-serif; letter-spacing:1.6px; }
      .stage { fill:#d8e6f7; font:700 12px Arial, sans-serif; letter-spacing:1.2px; }
      .meta { fill:#6f88a8; font:500 10px Arial, sans-serif; letter-spacing:.8px; }
      @keyframes flow { to { stroke-dashoffset:-96; } }
      @keyframes pulse { 0%,100% { opacity:.35; r:3; } 50% { opacity:1; r:5; } }
      @media (prefers-reduced-motion: reduce) { .trace, .pulse { animation:none; } }
    </style>
